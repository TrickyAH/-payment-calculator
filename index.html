<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-50 to-blue-50 p-6">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-8">Payment Calculator</h1>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">YouTuber Name</label>
                <input type="text" id="youtuberName" placeholder="Enter name" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
            </div>

            <div class="bg-purple-50 p-6 rounded-xl mb-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Regular Videos</h2>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Total Number of Videos</label>
                    <input type="number" id="totalVideos" placeholder="0" class="w-full px-4 py-3 border border-purple-200 rounded-lg">
                    <p class="text-sm text-gray-500 mt-1">$20 guaranteed per video</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Total Views Over 1,000 (Combined)</label>
                    <input type="number" id="excessViews" placeholder="0" class="w-full px-4 py-3 border border-purple-200 rounded-lg">
                    <p class="text-sm text-gray-500 mt-1">Add all views above 1k together. Example: Video 1 has 3,500 views → add 2,500. Video 2 has 1,800 views → add 800. Total: 3,300</p>
                </div>
            </div>

            <div class="bg-blue-50 p-6 rounded-xl mb-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Shorts</h2>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Payment Per Short ($)</label>
                    <input type="number" id="shortsRate" placeholder="0.00" step="0.01" class="w-full px-4 py-3 border border-blue-200 rounded-lg">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Number of Shorts Produced</label>
                    <input type="number" id="shortsCount" placeholder="0" class="w-full px-4 py-3 border border-blue-200 rounded-lg">
                </div>
            </div>

            <div class="bg-gradient-to-r from-purple-600 to-blue-600 p-6 rounded-xl text-white">
                <h2 class="text-xl font-semibold mb-4">Payment Breakdown</h2>
                
                <div class="space-y-3">
                    <div class="flex justify-between">
                        <span>Video Base Pay:</span>
                        <span id="videoBase" class="font-semibold">$0.00</span>
                    </div>
                    <div class="flex justify-between">
                        <span>View Bonus:</span>
                        <span id="viewBonus" class="font-semibold">$0.00</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Shorts Total:</span>
                        <span id="shortsTotal" class="font-semibold">$0.00</span>
                    </div>
                    <div class="border-t border-purple-300 pt-3 mt-3">
                        <div class="flex justify-between items-center">
                            <span class="text-xl font-bold">Total Payment:</span>
                            <span id="totalPayment" class="text-3xl font-bold">$0.00</span>
                        </div>
                    </div>
                </div>

                <button onclick="copyToClipboard()" class="mt-6 w-full px-6 py-3 bg-white text-purple-600 rounded-lg hover:bg-purple-50 font-semibold">
                    Copy to Clipboard
                </button>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const videos = parseFloat(document.getElementById('totalVideos').value) || 0;
            const views = parseFloat(document.getElementById('excessViews').value) || 0;
            const shorts = parseFloat(document.getElementById('shortsCount').value) || 0;
            const rate = parseFloat(document.getElementById('shortsRate').value) || 0;

            const videoBase = videos * 20;
            const viewBonus = (views / 1000) * 25;
            const shortsTotal = shorts * rate;
            const total = videoBase + viewBonus + shortsTotal;

            document.getElementById('videoBase').textContent = '$' + videoBase.toFixed(2);
            document.getElementById('viewBonus').textContent = '$' + viewBonus.toFixed(2);
            document.getElementById('shortsTotal').textContent = '$' + shortsTotal.toFixed(2);
            document.getElementById('totalPayment').textContent = '$' + total.toFixed(2);
        }

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', calculate);
        });

        function copyToClipboard() {
            const name = document.getElementById('youtuberName').value || 'YouTuber';
            const videos = document.getElementById('totalVideos').value || 0;
            const views = document.getElementById('excessViews').value || 0;
            const shorts = document.getElementById('shortsCount').value || 0;
            const rate = document.getElementById('shortsRate').value || 0;
            const videoBase = document.getElementById('videoBase').textContent;
            const viewBonus = document.getElementById('viewBonus').textContent;
            const shortsTotal = document.getElementById('shortsTotal').textContent;
            const total = document.getElementById('totalPayment').textContent;

            const text = `Payment Summary - ${name}

Regular Videos:
- Total Videos: ${videos}
- Video Base Pay: ${videoBase}
- Views Over 1K: ${views}
- View Bonus: ${viewBonus}

Shorts:
- Number of Shorts: ${shorts}
- Rate Per Short: $${rate}
- Shorts Total: ${shortsTotal}

TOTAL PAYMENT: ${total}`;

            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            });
        }
    </script>
</body>
</html>
